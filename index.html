<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pacman Runner</title>
    <link rel="icon" type="image/png" href="/chrome-dino-game/images/pacman/1.png" />
    <script type="module" crossorigin src="/chrome-dino-game/assets/index-DAxlXD9r.js"></script>
    <link rel="stylesheet" crossorigin href="/chrome-dino-game/assets/index-BGkXbT5Z.css">
  </head>
  <body>
    <!-- fullscreen button -->
    <div id="fullscreen-container">
      <button class="glass-btn" id="btn-fullscreen">
        <svg viewBox="0 0 24 24">
          <path
            d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"
          />
        </svg>
        <span>Fullscreen Landscape</span>
      </button>
    </div>

    <div id="mobile-controls">
      <!-- duck button -->
      <div class="mobile-touch-zone" id="btn-duck">
        <svg viewBox="0 0 24 24">
          <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
        </svg>
      </div>
      <!-- jump button -->
      <div class="mobile-touch-zone" id="btn-jump">
        <svg viewBox="0 0 24 24">
          <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6 1.41 1.41z" />
        </svg>
      </div>
    </div>

    <!-- rotate message for mobile -->
    <div id="rotate-notice">
      <!-- animated mobile -->
      <svg viewBox="0 0 24 24">
        <path
          d="M16 1H8C6.34 1 5 2.34 5 4v16c0 1.66 1.34 3 3 3h8c1.66 0 3-1.34 3-3V4c0-1.66-1.34-3-3-3zm-2 20h-4v-1h4v1zm4.5-3h-13V4h13v14z"
        />
      </svg>
      <h2>Draai je apparaat</h2>
      <p>Speel de game horizontaal (landscape) voor de beste speelervaring!</p>
    </div>

    <!-- game over screen -->
    <div id="game-over-overlay">
      <div class="game-over-card">
        <h1>Game Over</h1>
        <p class="final-score-text">
          Score: <span id="final-score-val">0000</span>
        </p>
        <div
          class="highscore-badge"
          id="new-highscore-badge"
          style="display: none"
        >
          🏆 NEW HIGHSCORE! 🏆
        </div>
        <button class="retry-btn" id="btn-retry">
          <svg viewBox="0 0 24 24">
            <path
              d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
            />
          </svg>
          <span>Retry</span>
        </button>
      </div>
    </div>

  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pacman Runner</title>
    <meta name="description" content="Pacman Runner – a fast-paced arcade runner. Dodge ghosts, collect dots, survive!" />
    <link rel="icon" type="image/png" href="/chrome-dino-game/images/pacman/1.png" />
    <script type="module" crossorigin src="/chrome-dino-game/assets/index-DeRKA9ee.js"></script>
    <link rel="stylesheet" crossorigin href="/chrome-dino-game/assets/index-ByIubNE_.css">
  </head>
  <body>

    <!-- ─── Portrait-mode warning (blocks all gameplay) ─────────────────── -->
    <div id="portrait-warning">
      <div class="portrait-card">
        <div class="rotate-icon">⟳</div>
        <p>Houd je scherm horizontaal om te spelen</p>
      </div>
    </div>

    <!-- ─── Start screen ─────────────────────────────────────────────────── -->
    <div id="start-screen-overlay" class="active">
      <div class="game-over-card">
        <h1>PACMAN RUNNER</h1>

        <!-- Desktop hint (hidden on touch devices via CSS) -->
        <p class="final-score-text desktop-hint">
          Gebruik <kbd>↑</kbd> / <kbd>↓</kbd> om te spelen
        </p>

        <!-- Mobile hint (hidden on non-touch devices via CSS) -->
        <p class="final-score-text mobile-hint">
          Tik de knoppen links &amp; rechts om te spelen
        </p>

        <div class="credits-container">
          <p class="made-by-text">Made by Vince van Apeldoorn</p>
        </div>
      </div>
    </div>

    <!-- ─── Game-over screen ──────────────────────────────────────────────── -->
    <div id="game-over-overlay">
      <div class="game-over-card">
        <h1>Game Over</h1>
        <p class="final-score-text">
          Score: <span id="final-score-val">0000</span>
        </p>
        <div
          class="highscore-badge"
          id="new-highscore-badge"
          style="display: none"
        >
          NEW HIGHSCORE!
        </div>
        <button class="retry-btn" id="btn-retry">
          <svg viewBox="0 0 24 24">
            <path
              d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
            />
          </svg>
          <span>Retry</span>
        </button>

        <div class="credits-container">
          <p class="made-by-text">Made by Vince van Apeldoorn</p>
        </div>
      </div>
    </div>

    <!-- ─── Fullscreen button (always visible) ────────────────────────────── -->
    <button id="btn-fullscreen" aria-label="Fullscreen">
      <svg id="fs-icon-enter" viewBox="0 0 24 24" fill="currentColor">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
      <svg id="fs-icon-exit" viewBox="0 0 24 24" fill="currentColor" style="display:none">
        <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
      </svg>
    </button>

    <!-- ─── Mobile on-screen controls ───────────────────────────────────── -->
    <!--
      Round buttons, visible only on touch devices.
      Left = Omlaag (Down), Right = Omhoog (Up).
    -->
    <div id="mobile-controls" aria-hidden="true">
      <button id="btn-move-down" class="ctrl-btn ctrl-down" aria-label="Omlaag">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 10l5 5 5-5z"/>
        </svg>
      </button>
      <button id="btn-move-up" class="ctrl-btn ctrl-up" aria-label="Omhoog">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M7 14l5-5 5 5z"/>
        </svg>
      </button>
    </div>

  </body>
</html>
